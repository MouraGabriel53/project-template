name: Check conventions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MouraGabriel53/project-template
          ref: main
          path: .conventions

      - name: Check pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          .conventions/.githooks/commit-msg "$RUNNER_TEMP/title" title

  commits:
    name: Conventional Commits messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MouraGabriel53/project-template
          ref: main
          path: .conventions

      - name: Check every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! .conventions/.githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error::Commit $sha does not follow Conventional Commits."
              failed=1
            fi
          done
          exit "$failed"
